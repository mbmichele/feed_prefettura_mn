name: Rigenera feed RSS notizie Prefettura di Mantova

# Doppio trigger:
# 1) schedule interno (GitHub Actions), ogni ora
# 2) workflow_dispatch, innescabile anche da un cronjob esterno (es.
#    cron-job.org) che chiama:
#      POST https://api.github.com/repos/mbmichele/feed_prefettura_mn/actions/workflows/build-feed.yml/dispatches
#      body: {"ref": "main"}
#      header: Authorization: Bearer <PAT con permesso "Actions: write">
#
# NB: gli schedule di GitHub Actions non sono garantiti al minuto esatto
# (possono slittare di qualche minuto nei momenti di carico); il cron
# esterno resta utile come innesco aggiuntivo/di backup più puntuale.
#
# IMPORTANTE — blocco anti-bot del sito sorgente: le esecuzioni reali di
# questo workflow (19/09, 03/10, 10/10/2026) hanno sempre ricevuto 403 dal
# sito, anche con Playwright/Chromium headless reale. Tutto indica un
# blocco sull'IP dei runner GitHub-hosted, non sul client usato (vedi nota
# dettagliata in cima a scripts/generate_feed.py). Due vie per aggirarlo,
# nessuna delle due attiva di default:
#   (a) "runs-on: self-hosted" qui sotto, puntando a un runner self-hosted
#       con IP residenziale (vedi README, sezione "Runner self-hosted");
#   (b) impostare i Secrets PROXY_SERVER / PROXY_USERNAME / PROXY_PASSWORD
#       (Settings -> Secrets and variables -> Actions) per instradare lo
#       scraping attraverso un proxy residenziale a pagamento — lo script
#       li usa automaticamente se presenti, altrimenti li ignora.
on:
  schedule:
    - cron: "0 * * * *"  # ogni ora, al minuto 0 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    # Per usare un runner self-hosted con IP residenziale, sostituisci con:
    #   runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Genera il feed
        env:
          # Variabili opzionali: se i Secrets non sono impostati nel repo,
          # restano vuote e lo script funziona esattamente come senza
          # proxy (nessun costo, nessun comportamento diverso).
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          # Il sito sorgente blocca a volte i runner con un 403 transitorio:
          # ritenta una volta dopo una pausa prima di dichiarare il run fallito.
          ok=0
          for i in 1 2; do
            if python scripts/generate_feed.py; then
              ok=1
              break
            fi
            echo "Generazione fallita (tentativo $i)."
            if [ "$i" -lt 2 ]; then sleep 120; fi
          done
          [ "$ok" = 1 ] || exit 1

      - name: Commit e push solo se il feed è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/feed.xml; then
            echo "Nessuna modifica al feed, niente da committare."
            exit 0
          fi
          cp docs/feed.xml "$RUNNER_TEMP/feed.xml"
          git add docs/feed.xml
          git commit -m "Aggiorna feed.xml [skip ci]"
          # Push concorrente (cron interno + esterno): il feed viene
          # rigenerato a ogni run, quindi in caso di conflitto si riparte
          # dall'ultimo origin/main e si riapplica il feed appena generato
          # (niente rebase, che andrebbe in conflitto sullo stesso file).
          pushed=0
          for i in 1 2 3 4; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push fallito (tentativo $i), riparto da origin/main e ritento..."
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/feed.xml" docs/feed.xml
            if git diff --quiet -- docs/feed.xml; then
              echo "Il feed su origin/main è già identico, niente da pubblicare."
              pushed=1
              break
            fi
            git add docs/feed.xml
            git commit -m "Aggiorna feed.xml [skip ci]"
            sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || exit 1
